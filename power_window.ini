[General]
network = src.LinNetwork
sim-time-limit = 2s
record-eventlog = true

# --- TOPOLOGY ---
*.numSlaves = 3  # Creates slaves[0], slaves[1], slaves[2]

# --- MASTER SCHEDULE ---
# 0x10: Master Command
# 0x20: Slave[0] (Front Left) Status
# 0x21: Slave[1] (Front Right) Status
# 0x22: Slave[2] (Rear) Status
*.master.scheduleConfiguration = "10:master:0.02; 20:FL_Door:0.02; 21:FR_Door:0.02; 22:Rear_Door:0.02"

# --- SIGNAL DEFINITIONS (Who publishes what?) ---

# Master: Publishes ID 0x10 (Command)
# Byte 0 = 1 (Global Open Command)
*.master.signalConfiguration = "10:0:1"

# Slave 0 (Front Left): Publishes ID 0x20
# Byte 0 = 100 (Position), Byte 1 = 25 (Temp)
*.slaves[0].signalConfiguration = "20:0:100; 20:1:25"

# Slave 1 (Front Right): Publishes ID 0x21
# Byte 0 = 50 (Position)
*.slaves[1].signalConfiguration = "21:0:50"

# Slave 2 (Rear): Publishes ID 0x22
# Byte 0 = 0 (Closed)
*.slaves[2].signalConfiguration = "22:0:0"
