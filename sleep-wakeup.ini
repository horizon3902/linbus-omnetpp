[General]
network = src.LinNetwork
sim-time-limit = 1.0s
record-eventlog = true

# --- TOPOLOGY ---
*.numSlaves = 2

# --- BUS (no random errors; focus on sleep/wakeup) ---
*.bus.frameErrorRate = 0.0
*.bus.frameDropRate  = 0.0

# --- MASTER SCHEDULE ---
# 0x10: Regular application frame
# 0x3C: Go-To-Sleep diagnostic command (sent once in a while)
*.master.scheduleConfiguration = "10:master:0.05; 3C:master:0.20"

# No collision resolution needed for this demo
*.master.collisionScheduleConfiguration = ""

# --- MASTER SIGNALS ---
# ID 0x10: Application signal (Byte0 = 1)
*.master.signalConfiguration = "10:0:1; 3C:0:0"

# Explanation:
#  - Frame 0x10: normal frame with Byte0=1
#  - Frame 0x3C: first data byte = 0 (Go-To-Sleep command)
#    Remaining bytes are implicitly 0 in our model, which is fine for demo.

# --- SLAVE SIGNALS ---
# Slave 0 responds to ID 0x10 with Byte0=100
*.slaves[0].signalConfiguration = "10:0:100"

# Slave 1 also responds to ID 0x10 with Byte0=200
*.slaves[1].signalConfiguration = "10:0:200"

# --- RESPONSE ERROR CONFIG (optional, kept simple here) ---
*.slaves[0].errorSignalConfiguration = ""
*.slaves[1].errorSignalConfiguration = ""

# --- WAKEUP DEMO (using wakeupTimer in LinNode) ---
# We simulate a button press on slave[0] that wakes the bus 0.6 s into the sim.
# To use this, add in LinNode::initialize():
#   if (!isMaster) scheduleAt(simTime() + par("wakeupTime").doubleValue(), wakeupTimer);
# and a parameter wakeupTime in LinNode.ned with default(-1), ignore if < 0.

*.slaves[0].wakeupTime = 0.6s
*.slaves[1].wakeupTime = -1s   # no wakeup from slave1
*.master.wakeupTime    = -1s   # master does not self-wakeup in this test
