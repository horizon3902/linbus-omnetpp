[General]
network = src.LinNetwork
sim-time-limit = 3s  # adjust per config if needed [web:206]

# Common PHY defaults (can be overridden per config)
*.bus.baudRate = 19200bps
*.bus.propDelay = 0.0001s
*.bus.interByteTime = 0.0001s
*.bus.frameErrorRate = 0
*.bus.frameDropRate  = 0

*.master.baudRate = 19200bps
*.master.propDelay = 0.0001s
*.master.interByteTime = 0.0001s

*.slaves[*].baudRate = 19200bps
*.slaves[*].propDelay = 0.0001s
*.slaves[*].interByteTime = 0.0001s

# Explicit break + delimiter timing knobs (new)
*.**.breakBits = 13
*.**.delimiterBits = 1

# ETF mapping used by all nodes
*.**.eventFrameConfiguration = "20:21,22"
*.**.eventRearmPeriod = -1s
*.**.eventProbability = 1.0

# Default: no inactivity sleep unless a config enables it
*.**.inactivitySleepTime = -1s

# Default DLC map (new): override per config if desired
# - 0x20 is ETF response length (byte0 inner PID + payload bytes)
# - 0x3C go-to-sleep should remain 8 for your current implementation
*.**.frameDlcConfiguration = "10=2;20=4;21=2;22=2;3C=8"


####################################################################
# 1) Sanity: normal traffic + ETF collision + resolution schedule
####################################################################
[Config M_AllFeatures_Sanity]
description = "Normal run. Tests: DLC map, break+delimiter, ETF collision+resolution."

sim-time-limit = 0.6s

# Make nodeAddress intentionally NOT equal to bus gate index to validate
# the 'sourceAddr is true identity' fix (bus no longer overwrites it).
*.master.nodeAddress = 10
*.slaves[0].nodeAddress = 20
*.slaves[1].nodeAddress = 30

# Master schedule: unconditional 0x10, then ETF 0x20
*.master.scheduleConfiguration = "10:M:0.05;20:M(E):0.05"
*.master.collisionScheduleConfiguration = "21:S0:0.02;22:S1:0.02"

# Publisher signals:
# - Master publishes 0x10 with Byte0=1 (DLC=2 => only bytes 0..1 exist)
*.master.signalConfiguration = "10:0:1"
# - Slaves publish their UCF payload bytes (DLC=2 => one payload byte each at byte0)
*.slaves[0].signalConfiguration = "21:0:40"
*.slaves[1].signalConfiguration = "22:0:200"

# No error bindings by default
*.**.errorSignalConfiguration = ""


####################################################################
# 2) DLC stress: make ETF and UCFs shorter/varied
####################################################################
[Config M_DLC_Stress]
description = "Varies DLC; ensures checksum/timeout/packing doesn't crash with short frames."

sim-time-limit = 0.6s

*.master.nodeAddress = 10
*.slaves[0].nodeAddress = 20
*.slaves[1].nodeAddress = 30

*.master.scheduleConfiguration = "10:M:0.05;20:M(E):0.05"
*.master.collisionScheduleConfiguration = "21:S0:0.02;22:S1:0.02"

# Different lengths
*.**.frameDlcConfiguration = "10=1;20=2;21=1;22=1;3C=8"

# Signals must fit within DLC:
# - 0x10 DLC=1 => only byte0 valid
*.master.signalConfiguration = "10:0:7"
# - 0x21/0x22 DLC=1 => only byte0 valid (when polled directly in resolution)
*.slaves[0].signalConfiguration = "21:0:11"
*.slaves[1].signalConfiguration = "22:0:22"

*.**.errorSignalConfiguration = ""


####################################################################
# 3) Error injection regression: ensure slaves ignore response after bad header
####################################################################
[Config M_ErrorInjection_Regression]
description = "Error injection on bus. Confirms: header mismatch => response ignored by slaves."

sim-time-limit = 1.3s

*.master.nodeAddress = 10
*.slaves[0].nodeAddress = 20
*.slaves[1].nodeAddress = 30

*.master.scheduleConfiguration = "10:M:0.05;20:M(E):0.05"
*.master.collisionScheduleConfiguration = "21:S0:0.02;22:S1:0.02"

*.master.signalConfiguration = "10:0:1"
*.slaves[0].signalConfiguration = "21:0:40"
*.slaves[1].signalConfiguration = "22:0:200"

# Turn on probabilistic errors
*.bus.frameErrorRate = 0.15
*.bus.frameDropRate  = 0.10


####################################################################
# 4) Sleep/Wakeup regression: go-to-sleep via 0x3C, then wakeup at 0.8s
####################################################################
[Config M_SleepWake]
description = "Tests go-to-sleep (0x3C) and wakeup confirmation via master header."

sim-time-limit = 2.0s

*.master.nodeAddress = 10
*.slaves[0].nodeAddress = 20
*.slaves[1].nodeAddress = 30

# Include go-to-sleep slot; after wakeup, schedule repeats (expected)
*.master.scheduleConfiguration = "10:M:0.05;20:M(E):0.05;3C:M:0.25"
*.master.collisionScheduleConfiguration = "21:S0:0.02;22:S1:0.02"

# Master publishes both 0x10 and go-to-sleep command on 0x3C (byte0=0)
*.master.signalConfiguration = "10:0:1;3C:0:0"
*.slaves[0].signalConfiguration = "21:0:40"
*.slaves[1].signalConfiguration = "22:0:200"

# Keep DLC sensible for sleep frame
*.**.frameDlcConfiguration = "10=2;20=4;21=2;22=2;3C=8"

# Wakeup after sleep
*.slaves[0].wakeupTime = 0.8s
*.slaves[1].wakeupTime = -1s


####################################################################
# 5) Inactivity sleep regression: all nodes sleep after 0.2s idle, wake at 1.2s
####################################################################
[Config M_InactivitySleep]
description = "Tests inactivity timer path + wakeup + schedule resume."

sim-time-limit = 3.0s

*.master.nodeAddress = 10
*.slaves[0].nodeAddress = 20
*.slaves[1].nodeAddress = 30

# No explicit 0x3C sleep frame; relies on inactivity sleep
# Create an idle gap > 0.2s between headers
*.master.scheduleConfiguration = "10:M:0.25;20:M(E):0.25"

*.master.collisionScheduleConfiguration = "21:S0:0.02;22:S1:0.02"

*.master.signalConfiguration = "10:0:1"
*.slaves[0].signalConfiguration = "21:0:40"
*.slaves[1].signalConfiguration = "22:0:200"

*.**.inactivitySleepTime = 0.2s
*.slaves[0].wakeupTime = 1.2s
*.slaves[1].wakeupTime = -1s
