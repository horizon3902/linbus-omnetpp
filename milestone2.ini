[General]
network = src.LinNetwork
sim-time-limit = 1.2s

# (Optional) make log easier to read
cmdenv-express-mode = false
cmdenv-status-frequency = 1000000s

# ----------------------------
# Topology
# ----------------------------
*.numSlaves = 2

# ----------------------------
# Bus parameters
# ----------------------------
*.bus.baudRate = 19200bps
*.bus.propDelay = 0.0001s
*.bus.interByteTime = 0.0001s
*.bus.frameErrorRate = 0
*.bus.frameDropRate  = 0

# ----------------------------
# Node PHY parameters
# ----------------------------
*.master.baudRate = 19200bps
*.master.propDelay = 0.0001s
*.master.interByteTime = 0.0001s

*.slaves[*].baudRate = 19200bps
*.slaves[*].propDelay = 0.0001s
*.slaves[*].interByteTime = 0.0001s

# ----------------------------
# Disable wakeup test (not needed for Milestone 2)
# ----------------------------
*.master.wakeupTime = -1s
*.slaves[*].wakeupTime = -1s

# ----------------------------
# Milestone 2: ETF mapping (must be set on ALL nodes)
# ETF header ID 0x20 can carry UCF 0x21 or 0x22 (PID in byte0 of response).
# ----------------------------
*.master.eventFrameConfiguration = "20:21,22"
*.slaves[*].eventFrameConfiguration = "20:21,22"

# ----------------------------
# Master schedule
# Alternating unconditional 0x10 and ETF 0x20.
# Note: "(E)" in the publisher field marks ETF in your parser.
# ----------------------------
*.master.scheduleConfiguration = "10:M:0.05;20:ETF(E):0.05"

# Collision resolution schedule: master polls the underlying UCFs individually
*.master.collisionScheduleConfiguration = "21:RES:0.02;22:RES:0.02"

# ----------------------------
# Signals (publishers)
# Master publishes unconditional 0x10, Byte0=1
# Slave0 publishes UCF 0x21, Byte0=0x40 (64)
# Slave1 publishes UCF 0x22, Byte0=0xC8 (200)
# ----------------------------
*.master.signalConfiguration   = "10:0:1"
*.slaves[0].signalConfiguration = "21:0:64"
*.slaves[1].signalConfiguration = "22:0:200"

# No error-bit bindings for this test
*.master.errorSignalConfiguration = ""
*.slaves[*].errorSignalConfiguration = ""

# ----------------------------
# Event generation behavior
# By default your code starts UCF events as pending=true once.
# Here: only Slave0 re-arms later so you can see a single-response ETF.
# ----------------------------
*.slaves[0].eventRearmPeriod = 0.5s
*.slaves[0].eventProbability = 1.0

*.slaves[1].eventRearmPeriod = -1s
*.slaves[1].eventProbability = 0.0
