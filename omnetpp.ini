[General]
network = src.LinNetwork
sim-time-limit = 5s
record-eventlog = true

# --- TOPOLOGY ---
*.numSlaves = 3  # Creates slaves[0], slaves[1], slaves[2]

# --- BUS CONFIGURATION (NEW: Error Injection) ---
# 10% chance to corrupt a frame (flip bits in PID or Data)
# 5% chance to completely drop a frame (test Master Timeout)
*.bus.frameErrorRate = 0.1
*.bus.frameDropRate  = 0.05

# --- MASTER SCHEDULE ---
# 0x10: Master Command
# 0x20: Slave 0 (Front Left) Status
# 0x21: Slave 1 (Front Right) Status
# 0x22: Slave 2 (Rear) Status
*.master.scheduleConfiguration = "10:master:0.02; 20:FL_Door:0.02; 21:FR_Door:0.02; 22:Rear_Door:0.02"

# --- SIGNAL DEFINITIONS (Normal Operation) ---
# Master: Publishes ID 0x10 (Command), Byte 0 = 1
*.master.signalConfiguration = "10:0:1"

# Slave 0: Publishes ID 0x20, Byte 0 = 100
*.slaves[0].signalConfiguration = "20:0:100"

# Slave 1: Publishes ID 0x21, Byte 0 = 50
*.slaves[1].signalConfiguration = "21:0:50"

# Slave 2: Publishes ID 0x22, Byte 0 = 0
*.slaves[2].signalConfiguration = "22:0:0"

# --- ERROR SIGNAL MAPPING (NEW: ISO Compliance) ---
# If a node detects an error (Checksum/Header/Timeout), 
# it sets a specific bit in its next published frame.

# Slave 0: Reports error in Frame 0x20, Byte 1, Bit 0
*.slaves[0].errorSignalConfiguration = "20:1:0"

# Slave 1: Reports error in Frame 0x21, Byte 0, Bit 7
*.slaves[1].errorSignalConfiguration = "21:0:7"

# Slave 2: Reports error in Frame 0x22, Byte 0, Bit 0
*.slaves[2].errorSignalConfiguration = "22:0:0"
