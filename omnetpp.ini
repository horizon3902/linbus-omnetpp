[General]
network = LinNetwork
sim-time-limit = 2s

# Logging options (optional)
record-eventlog = true
cmdenv-express-mode = false

# Visualization (optional)
*.**.display-name = ""
*.**.typename = ""

# Node behavior
*.master.sendInterval = 0.01s
*.slave1.sendInterval = 0.02s
*.slave2.sendInterval = 0.03s
