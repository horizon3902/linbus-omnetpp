############################################################
# FULL REGRESSION TEST SUITE — LIN Bus Simulator (ISO 17987)
#
# Tests covered:
#   T1  Unconditional frames (UCF) — nominal polling & signal encoding
#   T2  Protected Identifier (PID) parity — non-trivial node addresses
#   T3  DLC variation — 1, 2, 4, 8-byte payloads, timing correctness
#   T4  Enhanced checksum — standard frames
#   T5  Classic checksum — diagnostic frames 0x3C / 0x3D
#   T6  Event-Triggered Frame (ETF) collision + resolution schedule
#   T7  ETF status management — collision must NOT set response_error
#   T8  Response-error telemetry — checksum fault maps into slave frame bit
#   T9  Probabilistic fault injection — PID corruption, frame drops
#   T10 Go-To-Sleep (0x3C, explicit master broadcast)
#   T11 Slave-initiated wakeup pulse + master schedule resume
#   T12 Inactivity-based sleep + wakeup
#   T13 Diagnostic transport (ISO 17987-2):
#         - 8-byte Single Frame master request (NAD + PCI + SID + padding)
#         - Slave ignores request not addressed to it
#         - Slave defers response until master issues 0x3D header
#         - Master receives and parses 8-byte slave response
#   T14 Diagnostics off — 0x3C/0x3D used only for sleep; not intercepted
#   T15 Wakeup timing parameters — parameterised threshold / expiry
#   T16 Collision resolution start at next slot boundary (collisionStartDelay default)
#
# Build:  opp_env run -w /home/djm/omnet -c "make"
# Run all:
#   opp_env run -w /home/djm/omnet -c \
#     "./linbus -u Cmdenv -f full-test.ini -c <Config>"
############################################################

[General]
network        = src.LinNetwork
sim-time-limit = 2.0s

# ---- Default PHY (all configs share these unless overridden) ----
*.bus.baudRate       = 19200bps
*.bus.propDelay      = 0.0001s
*.bus.interByteTime  = 0.0001s
*.bus.frameErrorRate = 0
*.bus.frameDropRate  = 0

*.**.baudRate      = 19200bps
*.**.propDelay     = 0.0001s
*.**.interByteTime = 0.0001s
*.**.breakBits     = 13
*.**.delimiterBits = 1

# ---- Default feature disables (keep configs isolated) ----
*.**.eventFrameConfiguration  = ""
*.**.eventRearmPeriod         = -1s
*.**.eventProbability         = 1.0
*.**.signalConfiguration      = ""
*.**.errorSignalConfiguration = ""
*.**.frameDlcConfiguration    = ""
*.**.inactivitySleepTime      = -1s
*.**.wakeupTime               = -1s
*.**.enableDiagnostics        = false

# ---- Wakeup timing (ISO 17987 defaults) ----
*.**.wakeupDetectThreshold = 0.00015s
*.**.masterWakeupDelay     = 0.002s
*.**.wakeupExpiryTime      = 0.150s

# ---- Default node addresses (can be overridden per config) ----
# LinNetwork.ned now uses default() so ini overrides work.
*.master.nodeAddress    = 1
*.slaves[0].nodeAddress = 2
*.slaves[1].nodeAddress = 3

*.master.collisionScheduleConfiguration = ""


############################################################
# T1 / T2 / T4 — UCF Nominal Polling + PID Parity
#   Master polls two UCFs from two slaves.
#   Node addresses (1,2,3) → non-trivial PIDs to exercise parity logic.
#   Runs for 1 s → ~10 complete schedule cycles.
############################################################
[Config T1_UCF_Nominal]
description = "T1/T2/T4: Unconditional frames, PID parity, enhanced checksum"

sim-time-limit = 1.0s

# Simple 2-slot schedule: poll slave 0 on 0x10, slave 1 on 0x11
*.master.scheduleConfiguration = "10:S0:0.05;11:S1:0.05"

*.slaves[0].signalConfiguration = "10:0:28"   # Byte0 = 0x1C (40 decimal)
*.slaves[1].signalConfiguration = "11:0:200"

*.**.frameDlcConfiguration = "10=2;11=2"


############################################################
# T3 — DLC Variation (1, 2, 4, 8 bytes)
#   Four frames with different DLCs; verifies response window length
#   scaling with formula Ttx = (DLC+1)*10/baudRate.
############################################################
[Config T3_DLC_Stress]
description = "T3: DLC=1,2,4,8 payloads — timing and checksum correctness"

sim-time-limit = 1.0s

*.master.scheduleConfiguration = "10:S0:0.03;11:S0:0.05;12:S0:0.08;13:S0:0.12"

*.slaves[0].signalConfiguration = "10:0:1;11:0:2;12:0:4;13:0:8"
# DLC map: matches frame IDs to byte lengths
*.**.frameDlcConfiguration = "10=1;11=2;12=4;13=8"


############################################################
# T5 / T13 / T14 — Diagnostic Transport (ISO 17987-2)
#   Master → slave SF request on 0x3C (NAD=2, PCI=0x02, SID=0x10, 5×0xFF)
#   Slave[0] (NAD=2) stages response; transmits only on 0x3D header.
#   Slave[1] (NAD=3) silently ignores (not addressed).
#   Master receives and logs the response.
############################################################
[Config T5_Diagnostics_SF]
description = "T5/T13: ISO 17987-2 Single Frame diagnostics — 8-byte request+response"

sim-time-limit = 2.0s

*.master.nodeAddress    = 1
*.slaves[0].nodeAddress = 2    # will be addressed
*.slaves[1].nodeAddress = 3    # should stay silent

*.**.enableDiagnostics  = true
*.master.diagTargetAddress = 2  # target slave[0]

# Schedule: request slot then response slot, repeated
*.master.scheduleConfiguration = "3C:M:0.10;3D:S:0.10"

# Classic checksum for 0x3C/0x3D
*.**.frameDlcConfiguration = "3C=8;3D=8"


############################################################
# T14 — Diagnostics Disabled (0x3C used for Go-To-Sleep only)
#   When enableDiagnostics=false, the 0x3C frame MUST NOT be intercepted
#   by the diag layer. It must be treated as a Go-To-Sleep command only.
#
#   Master is publisher for BOTH 0x10 (application) and 0x3C (sleep).
#   Slaves subscribe to 0x10 (receive only, no collision).
############################################################
[Config T14_DiagDisabled_GoToSleep]
description = "T14: Diagnostics off — 0x3C used for Go-To-Sleep, not intercepted"

sim-time-limit = 1.5s

# Diagnostics intentionally left false (global default)
*.**.enableDiagnostics = false

# Master is publisher for 0x10 and 0x3C
*.master.scheduleConfiguration = "10:M:0.05;3C:M:0.20"
*.master.signalConfiguration   = "10:0:1;3C:0:0"      # 3C byte0=0 → go-to-sleep

# Slaves subscribe to 0x10 (no signal config means they are receivers only)
*.slaves[0].signalConfiguration = ""
*.slaves[1].signalConfiguration = ""

*.**.frameDlcConfiguration = "10=2;3C=8"

# Wakeup after sleep so schedule resumes
*.slaves[0].wakeupTime = 0.8s


############################################################
# T6 / T7 / T16 — ETF Collision + Resolution + Status Management
#   Both slaves respond on ETF 0x20 → collision detected.
#   Master switches to collision resolution schedule.
#   ETF collision MUST NOT set response_error (ISO 17987-3 §7.2).
#   Resolution table starts at next slot boundary (collisionStartDelay=-1).
############################################################
[Config T6_ETF_Collision]
description = "T6/T7/T16: ETF collision, resolution schedule, status management"

sim-time-limit = 1.0s

*.master.nodeAddress    = 10
*.slaves[0].nodeAddress = 20
*.slaves[1].nodeAddress = 30

*.**.eventFrameConfiguration = "20:21,22"
*.**.eventProbability        = 1.0  # always trigger event flag → guaranteed collision

# Schedule: UCF + ETF
*.master.scheduleConfiguration            = "10:M:0.05;20:M(E):0.05"
*.master.collisionScheduleConfiguration   = "21:S0:0.02;22:S1:0.02"

*.master.signalConfiguration   = "10:0:1"
*.slaves[0].signalConfiguration = "21:0:40;20:0:100"
*.slaves[1].signalConfiguration = "22:0:200;20:0:200"

*.**.frameDlcConfiguration = "10=2;20=4;21=2;22=2"

# collisionStartDelay left at default (-1) → next slot boundary (T16)


############################################################
# T8 / T9 — Error Injection + Response-Error Telemetry
#   Bus injects random bit-flips and frame drops.
#   A slave maps its last checksum error into Bit0 of its UCF payload.
#   Verifies ISO error reporting path without crash.
############################################################
[Config T8_ErrorInjection]
description = "T8/T9: Probabilistic fault injection + response-error telemetry bit"

sim-time-limit = 1.5s

*.master.nodeAddress    = 1
*.slaves[0].nodeAddress = 2
*.slaves[1].nodeAddress = 3

*.master.scheduleConfiguration = "10:S0:0.05;11:S1:0.05"

*.slaves[0].signalConfiguration      = "10:0:40"
*.slaves[1].signalConfiguration      = "11:0:200"
# Slave 0: map response_error into Byte0 Bit0 of frame 0x10
*.slaves[0].errorSignalConfiguration = "10:0:0"
*.slaves[1].errorSignalConfiguration = "11:0:0"

*.**.frameDlcConfiguration = "10=2;11=2"

# Probabilistic errors (10% bit-flip, 5% drop)
*.bus.frameErrorRate = 0.10
*.bus.frameDropRate  = 0.05


############################################################
# T10 / T11 — Explicit Go-To-Sleep + Slave Wakeup Pulse
#   Master publishes 0x10 (application frame) and 0x3C (go-to-sleep).
#   All nodes enter SLEEP.
#   Slave[0] issues dominant wakeup pulse at 0.6 s.
#   Master detects pulse → waits masterWakeupDelay → resumes schedule.
############################################################
[Config T10_SleepWakeup]
description = "T10/T11: Explicit go-to-sleep + slave wakeup pulse + schedule resume"

sim-time-limit = 2.0s

*.master.nodeAddress    = 1
*.slaves[0].nodeAddress = 2
*.slaves[1].nodeAddress = 3

# Master publishes both frames; slaves are subscribers
*.master.scheduleConfiguration          = "10:M:0.05;3C:M:0.20"
*.master.collisionScheduleConfiguration = ""

*.master.signalConfiguration   = "10:0:1;3C:0:0"
*.slaves[0].signalConfiguration = ""
*.slaves[1].signalConfiguration = ""

*.**.frameDlcConfiguration = "10=2;3C=8"

# Wakeup at t=0.6s (after the sleep at ~t=0.25s)
*.slaves[0].wakeupTime = 0.6s


############################################################
# T12 / T15 — Inactivity Sleep + Parameterised Wakeup Timing
#   No explicit 0x3C. Nodes sleep via inactivity timer.
#   wakeupDetectThreshold and masterWakeupDelay are set explicitly
#   to verify the NED parameters are read correctly.
#   Slave wakeup restarts master schedule.
############################################################
[Config T12_InactivitySleep]
description = "T12/T15: Inactivity-based sleep + parameterised wakeup timing"

sim-time-limit = 3.0s

*.master.nodeAddress    = 1
*.slaves[0].nodeAddress = 2
*.slaves[1].nodeAddress = 3

# Long period creates idle gaps → inactivity timer fires first
*.master.scheduleConfiguration = "10:S0:0.30;11:S1:0.30"

*.slaves[0].signalConfiguration = "10:0:50"
*.slaves[1].signalConfiguration = "11:0:75"

*.**.frameDlcConfiguration   = "10=2;11=2"
*.**.inactivitySleepTime     = 0.25s   # fires within idle gap

# Explicit timing parameters (T15)
*.**.wakeupDetectThreshold = 0.00015s  # 150 µs
*.**.masterWakeupDelay     = 0.002s    # 2 ms
*.**.wakeupExpiryTime      = 0.150s    # 150 ms

*.slaves[0].wakeupTime = 1.5s
*.slaves[1].wakeupTime = -1s
