[General]
network = src.LinNetwork
sim-time-limit = 2.0s
record-eventlog = true

# --- TOPOLOGY ---
*.numSlaves = 2

# --- PHY SETTINGS ---
*.bus.baudRate = 19200bps
*.bus.frameErrorRate = 0.0
*.bus.frameDropRate  = 0.0

# --- SCHEDULE CONFIGURATION ---
#
# 1. Normal Schedule:
#    - 0x10: Unconditional Frame (Period 0.05s)
#    - 0x20: Event-Triggered Frame (ETF), marked with (E) (Period 0.05s)
#    - 0x3C: Go-To-Sleep Command (Period 0.1s)
#
# 2. Collision Resolution Schedule:
#    - If 0x20 collides, Master polls Slaves individually using 0x21 and 0x22.
#
*.master.scheduleConfiguration = "10:Master:0.05; 20:Slave(E):0.05; 3C:Master:0.10"
*.master.collisionScheduleConfiguration = "21:Slave0:0.02; 22:Slave1:0.02"

# --- SIGNAL CONFIGURATION ---

# MASTER:
# - Publishes 0x10 (Data=1)
# - Publishes 0x3C (Sleep Command: Data[0]=0x00, rest default to 0xFF in code)
*.master.signalConfiguration = "10:0:1; 3C:0:0"

# SLAVE 0:
# - Responds to ETF 0x20 (Data=100)
# - Responds to Poll 0x21 (Data=100)
# - WAKEUP: Initiates wakeup at t=1.2s
*.slaves[0].signalConfiguration = "20:0:100; 21:0:100"
*.slaves[0].wakeupTime = 1.2s

# SLAVE 1:
# - Responds to ETF 0x20 (Data=200) -> CAUSES COLLISION on 0x20
# - Responds to Poll 0x22 (Data=200)
*.slaves[1].signalConfiguration = "20:0:200; 22:0:200"
*.slaves[1].wakeupTime = -1s
*.master.wakeupTime    = -1s

# --- EXPECTED TIMELINE ---
# t=0.00s: Start
# t=0.05s: Frame 0x10 (Normal)
# t=0.10s: Frame 0x20 (ETF) -> Both Slaves respond -> COLLISION
#          Master detects collision on ETF -> Switches to Resolution Schedule
#          Resolution: Frame 0x21 (Slave0) -> Frame 0x22 (Slave1)
#          Master returns to Normal Schedule
# t=~0.20s: Frame 0x3C (Sleep Command) -> Nodes enter SLEEP
# t=1.20s: Slave 0 sends WAKEUP PULSE
#          Master detects Pulse -> Immediately restarts Schedule (sends Header)
#          Communication resumes
