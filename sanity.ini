[General]
network = src.LinNetwork
sim-time-limit = 0.8s

# Topology
*.numSlaves = 2

# Bus params + error injection off for baseline validation
*.bus.baudRate = 19200bps
*.bus.propDelay = 0.0001s
*.bus.interByteTime = 0.0001s
*.bus.frameErrorRate = 0.0
*.bus.frameDropRate  = 0.0

# ---------------- MASTER ----------------
*.master.isMaster = true
# Slot 1: Go-to-sleep (master publishes response for 0x3C with D0=0x00, others default 0xFF)
# Slot 2: Event-triggered frame 0x20 (will collide because both slaves publish 0x20)
# Slot 3/4: Some normal traffic (optional)
*.master.scheduleConfiguration = "3C:Master:0.05; 20:Slaves(E):0.05; 21:Slave0:0.05; 22:Slave1:0.05"

# Collision resolving schedule polls unconditional frames 0x21 and 0x22
*.master.collisionScheduleConfiguration = "21:Slave0:0.01; 22:Slave1:0.01"

# Master publishes the sleep command (only need to force byte0=0; remaining bytes already init to 0xFF)
*.master.signalConfiguration = "3C:0:0"

# ---------------- SLAVES ----------------
*.slaves[*].isMaster = false

# Both slaves publish 0x20 => intentional collision on the ETF slot
*.slaves[0].signalConfiguration = "20:0:1; 21:0:17"
*.slaves[1].signalConfiguration = "20:0:2; 22:0:34"

# Optional: map last error into bit0 of byte0 on their unconditional frames
*.slaves[0].errorSignalConfiguration = "21:0:0"
*.slaves[1].errorSignalConfiguration = "22:0:0"

# Wakeup test: slave0 wakes the bus after sleep should have happened
*.slaves[0].wakeupTime = 0.20s
*.slaves[1].wakeupTime = -1s

# Logging (optional)
**.vector-recording = false
**.scalar-recording = true
