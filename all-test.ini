[General]
network = src.LinNetwork
sim-time-limit = 3s

# Make console logs readable
cmdenv-express-mode = false
cmdenv-status-frequency = 1000000s

# Topology
*.numSlaves = 2

# ----------------------------
# Shared PHY parameters
# ----------------------------
*.bus.baudRate = 19200bps
*.bus.propDelay = 0.0001s
*.bus.interByteTime = 0.0001s

*.master.baudRate = 19200bps
*.master.propDelay = 0.0001s
*.master.interByteTime = 0.0001s

*.slaves[*].baudRate = 19200bps
*.slaves[*].propDelay = 0.0001s
*.slaves[*].interByteTime = 0.0001s

# ETF mapping must be present on ALL nodes
*.master.eventFrameConfiguration  = "20:21,22"
*.slaves[*].eventFrameConfiguration = "20:21,22"

# Default: disable wakeup test unless overridden by a config
*.master.wakeupTime = -1s
*.slaves[*].wakeupTime = -1s

# Default: no periodic re-arming (pending=true once at start, then clears)
*.master.eventRearmPeriod = -1s
*.slaves[*].eventRearmPeriod = -1s
*.master.eventProbability = 1.0
*.slaves[*].eventProbability = 1.0

# Default: inactivity sleep enabled but long enough not to interfere (classic ~4s)
*.master.inactivitySleepTime = 4s
*.slaves[*].inactivitySleepTime = 4s

# Default: no bus error injection unless overridden
*.bus.frameErrorRate = 0
*.bus.frameDropRate  = 0


##############################################################################
# Config 1: "Everything functional" (M1 + M2 + GO-TO-SLEEP + WAKEUP)
##############################################################################
[Config M123_Functional]
sim-time-limit = 2.5s

# Master schedule:
# 0x10 unconditional (master publishes),
# 0x20 ETF (will collide initially because both slaves start pending),
# repeat once to show ETF silent slot after collision resolution,
# then 0x3C go-to-sleep command (master publishes).
*.master.scheduleConfiguration =
    "10:M:0.05;20:ETF(E):0.05;10:M:0.05;20:ETF(E):0.05;3C:M:0.05"

# Collision resolution polls underlying UCFs
*.master.collisionScheduleConfiguration = "21:RES:0.02;22:RES:0.02"

# Publishers/signals
*.master.signalConfiguration    = "10:0:1;3C:0:0"
*.slaves[0].signalConfiguration = "21:0:64"
*.slaves[1].signalConfiguration = "22:0:200"

# No error-bit binding for this run
*.master.errorSignalConfiguration = ""
*.slaves[*].errorSignalConfiguration = ""

# Wake the network after the GO-TO-SLEEP frame puts everyone to sleep
*.slaves[0].wakeupTime = 0.8s


##############################################################################
# Config 2: Error injection (checksum/header corruption + drops + timeout)
##############################################################################
[Config M123_ErrorInjection]
sim-time-limit = 2.5s

*.master.scheduleConfiguration =
    "10:M:0.05;20:ETF(E):0.05;10:M:0.05;20:ETF(E):0.05;3C:M:0.05"
*.master.collisionScheduleConfiguration = "21:RES:0.02;22:RES:0.02"

*.master.signalConfiguration    = "10:0:1;3C:0:0"
*.slaves[0].signalConfiguration = "21:0:64"
*.slaves[1].signalConfiguration = "22:0:200"

# Turn on bus-level fault injection
*.bus.frameErrorRate = 0.15
*.bus.frameDropRate  = 0.05

# Wake after sleep (if the sleep command makes it through)
*.slaves[0].wakeupTime = 0.8s


##############################################################################
# Config 3: Milestone 3 focused (inactivity-based sleep + wakeup restart)
##############################################################################
[Config M3_InactivitySleep]
sim-time-limit = 3s

# Make inactivity sleep easy to observe
*.master.inactivitySleepTime = 0.2s
*.slaves[*].inactivitySleepTime = 0.2s

# Schedule contains a long gap (0.8s) to allow inactivity timers to fire
*.master.scheduleConfiguration = "10:M:0.05;20:ETF(E):0.05;10:M:0.8"

# No go-to-sleep frame here (we want inactivity sleep to be the reason)
*.master.collisionScheduleConfiguration = "21:RES:0.02;22:RES:0.02"

*.master.signalConfiguration    = "10:0:1"
*.slaves[0].signalConfiguration = "21:0:64"
*.slaves[1].signalConfiguration = "22:0:200"

# Wake after everyone sleeps due to inactivity
*.slaves[0].wakeupTime = 1.2s
