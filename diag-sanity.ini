############################################################
# GENERAL
############################################################
[General]
network = src.LinNetwork
sim-time-limit = 1.5s

############################################################
# COMMON PHY
############################################################
*.bus.baudRate = 19200bps
*.bus.propDelay = 0.0001s
*.bus.interByteTime = 0.0001s
*.bus.frameErrorRate = 0
*.bus.frameDropRate  = 0

*.master.baudRate = 19200bps
*.master.propDelay = 0.0001s
*.master.interByteTime = 0.0001s

*.slaves[*].baudRate = 19200bps
*.slaves[*].propDelay = 0.0001s
*.slaves[*].interByteTime = 0.0001s

############################################################
# GLOBAL DEFAULTS (disable unrelated features)
############################################################
*.**.breakBits = 13
*.**.delimiterBits = 1

*.**.eventFrameConfiguration = ""
*.**.eventRearmPeriod = -1s
*.**.eventProbability = 1.0

*.**.signalConfiguration = ""
*.**.errorSignalConfiguration = ""

*.**.inactivitySleepTime = -1s
*.**.wakeupTime = -1s

############################################################
# DIAGNOSTIC SANITY CONFIG
############################################################
[Config DIAG_Sanity]
description = "LIN Diagnostics Sanity: SF + FF/CF RX + FC"

############################################################
# NODE ADDRESSES
############################################################
*.master.nodeAddress = 1
*.slaves[0].nodeAddress = 2
*.slaves[1].nodeAddress = 3

############################################################
# ENABLE DIAGNOSTICS
############################################################
*.**.enableDiagnostics = true

############################################################
# MASTER SCHEDULE
# Only diagnostic header (0x3C)
############################################################
*.master.scheduleConfiguration = "3C:M:0.20"

############################################################
# FRAME DLCs (Diagnostics need full 8 bytes)
############################################################
*.**.frameDlcConfiguration = "3C=8;3D=8"

############################################################
# NO COLLISION SCHEDULE
############################################################
*.master.collisionScheduleConfiguration = ""
