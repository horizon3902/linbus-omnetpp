[General]
network = src.LinNetwork
sim-time-limit = 3s
record-eventlog = true

# --- TOPOLOGY ---
*.numSlaves = 2

# --- BUS CONFIGURATION ---
# No random errors needed for this test; the collision is deterministic
*.bus.frameErrorRate = 0.0
*.bus.frameDropRate  = 0.0
# The bus logic will automatically flag collisions when two nodes transmit

# --- MASTER SCHEDULE (Normal) ---
# 0x10: Event-Triggered Frame (Both slaves might answer)
# 0x30: Regular frame just to keep the bus busy
*.master.scheduleConfiguration = "10:Event_Button:0.05; 30:Regular_Status:0.05"

# --- MASTER COLLISION RESOLVING SCHEDULE ---
# If 0x10 collides, the master pauses the normal schedule and runs this.
# It polls the individual unconditional frames associated with the event.
# 0x20 = Slave 0 unique ID
# 0x21 = Slave 1 unique ID
*.master.collisionScheduleConfiguration = "20:Slave0_Unique:0.02; 21:Slave1_Unique:0.02"

# --- SIGNAL DEFINITIONS ---

# 1. EVENT FRAME (0x10) - Both Slaves publish this!
# This creates the condition for a collision.
*.slaves[0].signalConfiguration = "10:0:1; 20:0:100" 
*.slaves[1].signalConfiguration = "10:0:2; 21:0:200"

# Note:
# Slave 0 sends "1" on ID 0x10, and "100" on its unique ID 0x20.
# Slave 1 sends "2" on ID 0x10, and "200" on its unique ID 0x21.

# --- ERROR SIGNAL MAPPING (Optional but good practice) ---
*.slaves[0].errorSignalConfiguration = "20:1:0"
*.slaves[1].errorSignalConfiguration = "21:1:0"
